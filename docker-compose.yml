version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: srm-postgres
    environment:
      POSTGRES_DB: srm_credit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres@2026"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  srm-credit-back:
    build: .
    container_name: srm-credit-back-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/srm_credit_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres@2026
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata: